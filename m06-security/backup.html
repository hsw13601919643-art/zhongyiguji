<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数据备份与恢复</title>
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
<div id="adm-content" class="hidden">
  <div class="grid grid-2 mb-2">
    <div class="card">
      <h3>手动备份</h3>
      <p class="text-2" style="font-size:14px">导出全部数据（药膳方、历史版本、推荐规则、科普内容、用户与推荐记录、操作日志、设置）为一个 JSON 文件，请妥善保存。</p>
      <button class="btn primary" id="export">导出全部数据</button>
    </div>
    <div class="card">
      <h3>从备份恢复</h3>
      <p class="text-2" style="font-size:14px">选择之前导出的备份文件。恢复会覆盖当前数据，恢复前系统会自动创建一份快照。</p>
      <input type="file" id="file" accept=".json,application/json">
      <div id="imp-info" class="mt-1"></div>
    </div>
  </div>
  <div class="card mb-2">
    <div class="card-title"><h3>自动备份快照</h3><button class="btn sm" id="snap">立即创建快照</button></div>
    <p class="muted" style="font-size:13px">管理端修改药膳方、规则或科普内容时自动创建快照（间隔不少于 10 分钟），保留最近 5 份。二期改为服务器定时备份。</p>
    <div class="table-wrap"><table class="table"><thead><tr><th>时间</th><th>原因</th><th>操作人</th><th class="num">药膳方</th><th class="num">规则</th><th class="num">内容</th><th>操作</th></tr></thead><tbody id="sn"></tbody></table></div>
  </div>
  <div class="grid grid-2">
    <div class="card"><h3>存储用量</h3><div id="usage"></div></div>
    <div class="card"><h3>恢复示例数据</h3><p class="text-2" style="font-size:14px">将药膳方、推荐规则、科普内容恢复为系统自带的示例数据（不影响日志和用户记录）。</p><button class="btn danger" id="reset">恢复示例数据</button></div>
  </div>
</div>

<script src="../assets/js/core.js"></script>
<script src="../assets/js/solar-terms.js"></script>
<script src="../assets/js/db.js"></script>
<script src="../assets/js/charts.js"></script>
<script src="../m01-database/data/dicts.js"></script>
<script src="../m01-database/data/yaoshi-106.js"></script>
<script src="../m01-database/data/recipes.js"></script>
<script src="../m01-database/model.js"></script>
<script src="../m04-engine/rules.js"></script>
<script src="../m02-user/data/contents.js"></script>
<script src="audit.js"></script>
<script src="auth.js"></script>
<script src="../m03-admin/admin.js"></script>
<script>
(function () {
  'use strict';
  if (!YS.admin.init({ key: 'backup', title: '数据备份与恢复', perm: 'backup.manage' })) return;
  var U = YS.util, esc = U.esc, S = YS.storage;
  var SKIP = ['login_lock'];

  function collect() {
    var data = {};
    S.keys().forEach(function (k) { if (SKIP.indexOf(k) < 0) data[k] = S.get(k, null); });
    return data;
  }
  function count(v) { return Array.isArray(v) ? v.length : (v && typeof v === 'object' ? Object.keys(v).length : (v === null ? 0 : 1)); }

  document.getElementById('export').onclick = function () {
    var d = new Date();
    var pkg = { app: 'ys-yaoshan', version: YS.version, exportedAt: Date.now(), exportedBy: YS.auth.user().username, data: collect() };
    U.download('药膳系统备份_' + U.fmtDate(d).replace(/-/g, '') + '-' + U.pad(d.getHours()) + U.pad(d.getMinutes()) + '.json', JSON.stringify(pkg, null, 1), 'application/json');
    YS.audit.log('导出备份', '全部数据', Object.keys(pkg.data).length + ' 项数据');
    YS.ui.toast('备份文件已下载', 'ok');
  };

  document.getElementById('file').onchange = function () {
    var f = this.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      var pkg;
      try { pkg = JSON.parse(String(rd.result)); } catch (e) { pkg = null; }
      var info = document.getElementById('imp-info');
      if (!pkg || pkg.app !== 'ys-yaoshan' || !pkg.data) { info.innerHTML = '<div class="notice danger">文件格式不正确，请选择本系统导出的备份文件。</div>'; return; }
      var keys = Object.keys(pkg.data);
      info.innerHTML = '<div class="notice info">备份时间：' + U.fmtTime(pkg.exportedAt) + '，导出人：' + esc(pkg.exportedBy || '') + '，版本 V' + esc(pkg.version) + '<br>药膳方 ' + count(pkg.data.c_recipes) + ' 首，规则 ' + count(pkg.data.c_rules) + ' 条，内容 ' + count(pkg.data.c_contents) + ' 篇，日志 ' + count(pkg.data.c_audit) + ' 条</div>' +
        '<button class="btn danger mt-1" id="do-restore">确认恢复</button>';
      document.getElementById('do-restore').onclick = function () {
        YS.ui.confirm('恢复将覆盖当前全部数据（系统会先自动创建快照），确定吗？', '恢复', true).then(function (ok) {
          if (!ok) return;
          YS.db.snapshot('恢复备份前');
          var me = YS.session.get('auth', null);
          keys.forEach(function (k) { if (SKIP.indexOf(k) < 0 && /^[\w-]+$/.test(k)) S.set(k, pkg.data[k]); });
          YS.audit.log('恢复备份', '全部数据', '从 ' + U.fmtTime(pkg.exportedAt) + ' 的备份恢复，共 ' + keys.length + ' 项', '成功', me);
          YS.ui.toast('恢复完成', 'ok');
          setTimeout(function () { location.reload(); }, 600);
        });
      };
    };
    rd.readAsText(f, 'utf-8');
  };

  function renderSnaps() {
    var list = YS.db.snapshots();
    document.getElementById('sn').innerHTML = list.map(function (s) {
      return '<tr><td class="nowrap">' + U.fmtTime(s.time) + '</td><td>' + esc(s.reason) + '</td><td>' + esc(s.user || '—') + '</td><td class="num">' + count(s.data.recipes) + '</td><td class="num">' + count(s.data.rules) + '</td><td class="num">' + count(s.data.contents) + '</td>' +
        '<td><button class="btn sm" data-restore="' + esc(s.id) + '">恢复到此快照</button></td></tr>';
    }).join('') || '<tr><td colspan="7" class="empty">暂无快照</td></tr>';
  }
  document.getElementById('snap').onclick = function () { YS.db.snapshot('手动快照'); YS.audit.log('创建快照', '药膳方/规则/内容', '手动'); renderSnaps(); YS.ui.toast('快照已创建', 'ok'); };
  document.getElementById('sn').addEventListener('click', function (e) {
    var b = e.target.closest('[data-restore]'); if (!b) return;
    var s = YS.db.snapshots().filter(function (x) { return x.id === b.getAttribute('data-restore'); })[0];
    YS.ui.confirm('将药膳方、规则、科普内容恢复到 ' + U.fmtTime(s.time) + ' 的快照，确定吗？', '恢复', true).then(function (ok) {
      if (!ok) return;
      YS.db.restoreSnapshot(s.id);
      YS.audit.log('恢复快照', '药膳方/规则/内容', '恢复到 ' + U.fmtTime(s.time));
      YS.ui.toast('已恢复', 'ok'); renderSnaps(); renderUsage();
    });
  });

  function renderUsage() {
    var rows = S.keys().map(function (k) { var v = ''; try { v = localStorage.getItem('ys_' + k) || ''; } catch (e) { v = ''; } return { label: k, value: v.length * 2 }; })
      .sort(function (a, b) { return b.value - a.value; });
    var total = rows.reduce(function (s, r) { return s + r.value; }, 0);
    var names = { c_recipes: '药膳方', versions: '历史版本', snapshots: '自动快照', c_audit: '操作日志', visits: '访问记录', c_reclogs: '推荐记录', c_users: '用户', c_rules: '推荐规则', c_contents: '科普内容', c_testlogs: '测评记录', favorites: '收藏' };
    document.getElementById('usage').innerHTML = '<p class="text-2" style="font-size:14px">已用约 <b>' + (total / 1024).toFixed(0) + ' KB</b>（浏览器上限通常约 5 MB）</p><div id="u-chart"></div>';
    YS.charts.hbar(document.getElementById('u-chart'), rows.slice(0, 8).map(function (r) { return { label: names[r.label] || r.label, value: r.value, display: (r.value / 1024).toFixed(1) + ' KB' }; }), { label: '存储用量' });
  }
  document.getElementById('reset').onclick = function () {
    YS.ui.confirm('将药膳方、规则、科普内容恢复为示例数据，当前修改会丢失（系统会先自动创建快照），确定吗？', '恢复', true).then(function (ok) {
      if (!ok) return;
      YS.db.snapshot('恢复示例数据前');
      ['recipes', 'rules', 'contents'].forEach(function (n) { YS.db.reset(n); });
      YS.audit.log('恢复示例数据', '药膳方/规则/内容', '');
      YS.ui.toast('已恢复示例数据', 'ok'); renderSnaps(); renderUsage();
    });
  };
  renderSnaps(); renderUsage();
})();
</script>
</body>
</html>
