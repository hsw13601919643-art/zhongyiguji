<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f5d50">
<title>我的收藏</title>
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/user.css">
<style>.u-main { max-width: 760px; } .fav-item { display: flex; gap: 12px; align-items: center; } .fav-item .info { flex: 1; min-width: 0; }</style>
</head>
<body>
<main class="u-main">
  <div class="tabs"><button class="tab on" data-t="recipe">药膳方</button><button class="tab" data-t="plan">推荐方案</button></div>
  <section id="list"></section>
  <section class="card mt-3">
    <h3>我的数据</h3>
    <p class="muted" style="font-size:14px">体质测评结果、收藏与使用记录仅保存在本机浏览器。</p>
    <div class="row tight"><a class="btn sm" href="../m06-security/privacy.html">隐私政策</a><button class="btn sm danger" id="clear">清除本机数据</button></div>
  </section>
</main>

<script src="../assets/js/core.js"></script>
<script src="../assets/js/solar-terms.js"></script>
<script src="../assets/js/db.js"></script>
<script src="../m01-database/data/dicts.js"></script>
<script src="../m01-database/data/yaoshi-106.js"></script>
<script src="../m01-database/data/recipes.js"></script>
<script src="../m01-database/model.js"></script>
<script src="user.js"></script>
<script>
(function () {
  'use strict';
  var U = YS.util, esc = U.esc;
  YS.user.init({ title: '我的收藏', tab: 'star', page: '收藏' });
  var type = 'recipe';
  function render() {
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (b) { b.classList.toggle('on', b.getAttribute('data-t') === type); });
    var rows = YS.fav.list().filter(function (f) { return f.type === type; });
    var el = document.getElementById('list');
    if (!rows.length) {
      el.innerHTML = '<div class="card empty">还没有收藏' + (type === 'recipe' ? '药膳方' : '推荐方案') + '。<br><a href="recommend.html">去看看今日推荐</a></div>';
      return;
    }
    el.innerHTML = rows.map(function (f) {
      var href, sub = '';
      if (f.type === 'recipe') {
        var r = YS.db.get('recipes', f.key);
        href = 'detail.html?id=' + encodeURIComponent(f.key);
        sub = r ? esc(YS.model.sourceText(r)) + ' · ' + esc(r.efficacy) : '该方已不可用';
      } else {
        href = 'recommend.html?' + f.key;
        sub = f.data && f.data.picks && f.data.picks.length ? esc(f.data.picks.join('；')) : '点击查看方案';
      }
      return '<div class="card fav-item mb-1"><div class="info"><a href="' + href + '" class="serif" style="font-size:17px;font-weight:700;color:var(--c-text)">' + esc(f.title) + '</a>' +
        '<div class="muted" style="font-size:13px">' + sub + '</div><div class="muted" style="font-size:12px">收藏于 ' + U.fmtDate(f.time) + '</div></div>' +
        '<button class="btn sm" data-del="' + esc(f.type) + '|' + esc(f.key) + '">移除</button></div>';
    }).join('');
  }
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (b) { b.onclick = function () { type = b.getAttribute('data-t'); render(); }; });
  document.getElementById('list').addEventListener('click', function (e) {
    var b = e.target.closest('[data-del]'); if (!b) return;
    var p = b.getAttribute('data-del').split('|');
    YS.fav.remove(p[0], p.slice(1).join('|'));
    render();
  });
  document.getElementById('clear').onclick = function () {
    YS.ui.confirm('将清除本机保存的体质测评结果、收藏、知情同意及使用记录，确定吗？', '清除', true).then(function (ok) {
      if (!ok) return;
      ['profile', 'favorites', 'consent', 'uid', 'test_count'].forEach(function (k) { YS.storage.remove(k); });
      YS.session.remove('ctest');
      YS.ui.toast('本机数据已清除', 'ok');
      setTimeout(function () { location.href = 'index.html'; }, 600);
    });
  };
  render();
})();
</script>
</body>
</html>
