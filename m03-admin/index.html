<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>药膳系统管理端</title>
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/admin.css">
<style>
  .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: linear-gradient(160deg, #2f5d50, #1f3d34); }
  .login { width: 100%; max-width: 420px; }
  .demo-acc td, .demo-acc th { padding: 6px 8px; font-size: 13px; }
  .demo-acc tbody tr { cursor: pointer; }
  .todo li { margin-bottom: 6px; }
</style>
</head>
<body>
<div id="login" class="login-wrap hidden">
  <div class="card login">
    <div class="row tight mb-2"><span class="brand-mark" style="width:40px;height:40px;border-radius:10px;background:var(--c-primary);color:#fff;display:grid;place-items:center;font-family:var(--font-serif);font-size:20px">膳</span>
      <div><h2 class="mb-0">药膳系统管理端</h2><div class="muted" style="font-size:13px">经典药膳方数据库及“三餐四季”推荐系统</div></div></div>
    <form id="lf" class="stack" autocomplete="off">
      <label class="field"><span>用户名</span><input type="text" id="un" required></label>
      <label class="field"><span>密码</span><input type="password" id="pw" required></label>
      <div class="error-text" id="lerr" role="alert"></div>
      <button class="btn primary block lg" type="submit">登录</button>
    </form>
    <div class="notice warn mt-2" style="font-size:13px">演示账号（点击填入）。纯前端版权限仅作演示，正式部署须改为服务端账号体系。</div>
    <div class="table-wrap mt-1"><table class="table demo-acc"><thead><tr><th>角色</th><th>用户名</th><th>密码</th></tr></thead><tbody id="acc"></tbody></table></div>
    <p class="center mt-2 mb-0" style="font-size:13px"><a href="../index.html">← 返回系统首页</a></p>
  </div>
</div>

<div id="adm-content" class="hidden">
  <div class="grid grid-4 mb-2" id="kpi"></div>
  <div class="grid grid-2">
    <div class="card"><div class="card-title"><h3>待办事项</h3></div><ul class="todo" id="todo"></ul></div>
    <div class="card"><div class="card-title"><h3>药膳方状态</h3><a href="recipes.html" class="btn ghost sm">管理 ›</a></div><div id="status-chart"></div></div>
  </div>
  <div class="card mt-2" id="logs-card"><div class="card-title"><h3>最近操作</h3><a href="../m06-security/logs.html" class="btn ghost sm">全部日志 ›</a></div><div id="logs"></div></div>
  <div class="card mt-2"><h3>我的权限</h3><div class="tags" id="perms"></div></div>
</div>

<script src="../assets/js/core.js"></script>
<script src="../assets/js/solar-terms.js"></script>
<script src="../assets/js/db.js"></script>
<script src="../assets/js/charts.js"></script>
<script src="../m01-database/data/dicts.js"></script>
<script src="../m01-database/data/yaoshi-106.js"></script>
<script src="../m01-database/data/recipes.js"></script>
<script src="../m01-database/model.js"></script>
<script src="../m06-security/audit.js"></script>
<script src="../m06-security/auth.js"></script>
<script src="admin.js"></script>
<script>
(function () {
  'use strict';
  var U = YS.util, esc = U.esc;
  var u = YS.auth.user();
  if (!u) {
    document.getElementById('login').classList.remove('hidden');
    document.getElementById('acc').innerHTML = YS.auth.ACCOUNTS.map(function (a) {
      return '<tr data-u="' + a.username + '" data-p="' + a.password + '"><td>' + esc(YS.auth.roleName(a.role)) + '</td><td>' + a.username + '</td><td>' + a.password + '</td></tr>';
    }).join('');
    document.getElementById('acc').onclick = function (e) {
      var tr = e.target.closest('tr'); if (!tr) return;
      document.getElementById('un').value = tr.getAttribute('data-u');
      document.getElementById('pw').value = tr.getAttribute('data-p');
    };
    document.getElementById('lf').onsubmit = function (e) {
      e.preventDefault();
      var r = YS.auth.login(document.getElementById('un').value.trim(), document.getElementById('pw').value);
      if (!r.ok) { document.getElementById('lerr').textContent = r.msg; return; }
      // 仅允许跳回本站路径（以单个“/”开头），防止开放重定向
      var next = U.qs('next');
      var safe = /^\/(?!\/)/.test(next) && !/[\r\n]/.test(next);
      location.href = safe ? (location.protocol === 'file:' ? 'file://' : '') + next : 'index.html';
    };
    return;
  }

  if (!YS.admin.init({ key: 'home', title: '工作台', perm: 'dashboard' })) return;
  var recipes = YS.db.list('recipes');
  var cnt = function (st) { return recipes.filter(function (r) { return r.status === st; }).length; };
  var users = YS.storage.get('c_users', []), recs = YS.storage.get('c_reclogs', []), visits = YS.storage.get('visits', []);
  var since7 = YS.admin.rangeStart(7);
  document.getElementById('kpi').innerHTML = [
    ['药膳方', recipes.length, '已发布 ' + cnt('published') + ' · 待审核 ' + cnt('pending')],
    ['标准化打样', recipes.filter(function (r) { return r.standardized; }).length + ' / 40', '验收目标 40 方'],
    ['用户数', users.length, '已测评 ' + users.filter(function (x) { return x.constitution; }).length],
    ['近7天推荐次数', recs.filter(function (r) { return r.t >= since7; }).length, '访问 ' + visits.filter(function (v) { return v.t >= since7; }).length + ' 次']
  ].map(function (k) { return '<div class="kpi"><div class="label">' + k[0] + '</div><div class="value">' + k[1] + '</div><div class="sub">' + k[2] + '</div></div>'; }).join('');

  var todo = [];
  if (YS.auth.can('recipe.review') && cnt('pending')) todo.push('<li><b>' + cnt('pending') + '</b> 首药膳方待审核 <a href="recipes.html?status=pending">去审核 ›</a></li>');
  if (YS.auth.can('recipe.publish') && cnt('approved')) todo.push('<li><b>' + cnt('approved') + '</b> 首已审核通过，待发布 <a href="recipes.html?status=approved">去发布 ›</a></li>');
  if (YS.auth.can('recipe.edit') && cnt('rejected')) todo.push('<li><b>' + cnt('rejected') + '</b> 首被驳回，待修改 <a href="recipes.html?status=rejected">去修改 ›</a></li>');
  if (YS.auth.can('recipe.edit') && cnt('draft')) todo.push('<li><b>' + cnt('draft') + '</b> 首草稿未提交审核 <a href="recipes.html?status=draft">查看 ›</a></li>');
  var sample = recipes.filter(function (r) { return r.sample; }).length;
  if (sample) todo.push('<li><b>' + sample + '</b> 首为示例数据，出处与标注待专家正式审核</li>');
  todo.push('<li>药食同源目录（106 种）待与官方公告逐一核对 <a href="../m01-database/index.html#yaoshi">查看 ›</a></li>');
  document.getElementById('todo').innerHTML = todo.join('');

  YS.charts.hbar(document.getElementById('status-chart'), Object.keys(YS.dict.statuses).map(function (k) {
    return { label: YS.dict.statuses[k].text, value: cnt(k), display: cnt(k) + ' 首', highlight: k === 'pending' };
  }), { label: '药膳方状态分布' });

  if (YS.auth.can('logs.view')) {
    var logs = YS.audit.list().slice(-6).reverse();
    document.getElementById('logs').innerHTML = logs.length ? '<div class="table-wrap"><table class="table"><tbody>' + logs.map(function (l) {
      return '<tr><td class="nowrap muted">' + U.fmtTime(l.t) + '</td><td>' + esc(l.name || l.username) + '</td><td>' + esc(l.action) + '</td><td>' + esc(l.target) + '</td><td>' +
        (l.result === '成功' ? '<span class="badge green">成功</span>' : '<span class="badge red">' + esc(l.result) + '</span>') + '</td></tr>';
    }).join('') + '</tbody></table></div>' : '<div class="empty">暂无日志</div>';
  } else document.getElementById('logs-card').classList.add('hidden');

  document.getElementById('perms').innerHTML = YS.auth.PERMS.map(function (p) {
    return '<span class="badge ' + (YS.auth.can(p[0]) ? 'green' : '') + '">' + (YS.auth.can(p[0]) ? '✓ ' : '✕ ') + esc(p[1]) + '</span>';
  }).join('');
})();
</script>
</body>
</html>
